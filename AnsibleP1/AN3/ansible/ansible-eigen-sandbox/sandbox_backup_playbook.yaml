---
    - name: BACK-UP VAN CLOUD SANDBOX DEVICE
      hosts: sandbox
      gather_facts: false
      connection: network_cli
      tasks:
        - name: SHOW RUNNING-CONFIG
          ios_command:
            commands:
              - show running-config
          register: config
    
        - name: OPSLAAN NAAR ./backups/
          copy:
            content: "{{ config.stdout[0] }}"
            dest: "backups/show_run_{{ inventory_hostname }}.txt"
    