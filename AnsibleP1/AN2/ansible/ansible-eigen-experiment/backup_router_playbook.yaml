---
    - name: AUTOMATISCHE BACK-UP VAN RUNNING-CONFIG
      hosts: CSR1kv
      gather_facts: false
      connection: local
      tasks:
        - name: SHOW RUNNING-CONFIG
          ios_command:
            commands:
              - show running-config
          register: config
    
        - name: OPSLAAN NAAR ./backups/
          copy:
            content: "{{ config.stdout[0] }}"
            dest: "backups/show_run_{{ inventory_hostname }}.txt"
    